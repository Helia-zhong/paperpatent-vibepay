services:
  - type: web
    name: paperpatent-vibepay
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/paperpatent-demo.sqlite
